[project]
name = "sas-mcp"
# Single source of truth is __version__ in src/sas_mcp/__init__.py, so a
# release cannot ship metadata that disagrees with what the CLI reports.
dynamic = ["version"]
description = "MCP server for writing, running, and validating SAS 9.4 code via SASPy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joe Matise", email = "matise-joe@norc.org" }]
keywords = ["sas", "saspy", "mcp", "llm", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp>=2.0",
    "saspy>=5.4",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sas-mcp = "sas_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/matise-joe-norc/sas-mcp"
Repository = "https://github.com/matise-joe-norc/sas-mcp"
Issues = "https://github.com/matise-joe-norc/sas-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sas_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sas_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
