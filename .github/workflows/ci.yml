name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not incidental here: the package resolves _authinfo vs
        # .authinfo, builds a SASHome classpath, and expands ~/.config by
        # platform. None of that is exercised on Linux alone.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The whole suite is SAS-free by design -- the log parser and guards are
      # pure functions, and the server tests run against a fake session -- so
      # it runs anywhere without a SAS deployment or credentials.
      - name: Run tests
        run: python -m pytest -q

      # `doctor` exits non-zero when it finds problems, and a bare CI runner
      # legitimately has no SAS configured -- so assert on its output, not its
      # exit status. This also confirms it correctly detects the unconfigured
      # state rather than silently claiming everything is fine.
      - name: Smoke-test the CLI
        shell: bash
        run: |
          sas-mcp --version
          sas-mcp doctor --no-network --json > doctor.json || true
          python -c "
          import json
          d = json.load(open('doctor.json'))
          assert 'verdict' in d and 'checks' in d, d
          names = {c['name'] for c in d['checks']}
          assert 'python' in names and 'saspy' in names, names
          assert d['counts']['fail'] >= 1, 'expected the missing config to be reported'
          assert any(c['name'] == 'config_file' and c['status'] == 'fail'
                     for c in d['checks']), d['checks']
          print('doctor reported', len(d['checks']), 'checks:', d['verdict'])
          "

      - name: Smoke-test config generation
        shell: bash
        run: |
          sas-mcp init --deployment oda --region us1 --path "$RUNNER_TEMP/sascfg_personal.py"
          python -c "
          import os, pathlib
          text = pathlib.Path(os.environ['RUNNER_TEMP'], 'sascfg_personal.py').read_text()
          ns = {}
          exec(compile(text, 'sascfg_personal.py', 'exec'), ns)
          assert ns['SAS_config_names'] == ['oda'], ns
          assert 'odaws01-usw2.oda.sas.com' in ns['oda']['iomhost'], ns
          print('generated config imports cleanly')
          "

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # Catches the metadata problems that only surface at upload time.
      - name: Check metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
